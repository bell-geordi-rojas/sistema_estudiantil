<style>
:root{
  color-scheme:light;
  --teal:#0e9aa7; --teal-d:#0b7f8a; --bg:#f3f5f9; --card:#fff; --ink:#1f2937; --mute:#6b7280; --line:#e8ebf1; --row:#f0f2f6;
  --side:#f7f8fc; --hover:#eceffa; --violet-l:#e6d9fb; --violet-ink:#5b21b6; --nav-on:#4c1d95; --input-bg:#fff; --input-bd:#d6dbe6;
  --chip-on:#e9eefc; --chip-bd:#c9d6fa; --green:#10b981; --red:#ef4444; --shadow:0 1px 3px rgba(20,30,60,.07);
  --danger-bd:#fbd0d0; --focus:#9ddde3; --btn-sec:#374151; --ok-bg:#d1fae5; --ok-ink:#065f46; --warn-bg:#fef3c7; --warn-ink:#92400e;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#0f1420; --card:#171d2b; --ink:#e5e9f2; --mute:#8f9ab0; --line:#262e42; --row:#202839; --side:#131926; --hover:#1f2740;
  --violet-l:#2d2250; --violet-ink:#cdb8ff; --nav-on:#e2d4ff; --input-bg:#10151f; --input-bd:#33405a; --chip-on:#1c2a4d; --chip-bd:#2f4380;
  --shadow:0 1px 3px rgba(0,0,0,.45); --danger-bd:#5b2a2a; --focus:#14656d; --btn-sec:#d5dbe8; --ok-bg:#0f3a2c; --ok-ink:#7ee0b8;
  --warn-bg:#3d3216; --warn-ink:#f3cf7a;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--teal);color:#fff;min-height:56px;display:flex;align-items:center;padding:6px 20px;gap:14px;flex-wrap:wrap}

.logo i{width:28px;height:28px;border-radius:50%;background:#fff;display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#1f6feb}
header .sp{flex:1}

.tree,.tree ul{list-style:none;margin:0;padding-left:20px}
.tree{padding-left:0}

.login{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:20px}
.login .card{width:min(460px,100%);padding:22px}
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--side);padding:4px;border-radius:9px}

.res button{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:8px;font:inherit;cursor:pointer}

<body>
<div id="root"></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast"></div>

<script>
/* ===== Configuración ===== */
const SUPABASE_URL = "https://tikpnokwqkofitguvpdx.supabase.co";
const SUPABASE_KEY = "sb_publishable_jJgmXkQMlB2UH-E70KOvYg_sjQz-xwH"; // clave pública (publishable): es pública por diseño
const EMAIL_DOMINIO = "acceso.estudiantil.app"; // correo interno de las cuentas (usuario@dominio); debe coincidir con config.email_dominio en la base

const NOTA_MIN = 0, NOTA_MAX = 20, NOTA_APROBACION = 11, MAX_NOTAS = 20;
const PESOS = [1, 2, 3, 4];   // ponderación de una nota (solo universidades); si no se elige vale 1
const ROL = { dueno: "Dueño", admin: "Administrador", docente: "Docente", alumno: "Alumno" };
const PERMISOS = {
  ver_companeros: "Ver a sus compañeros de clase",
  ver_notas_companeros: "Ver las notas de sus compañeros",
  ver_estadisticas: "Ver estadísticas",
  registrar_estudiantes: "Registrar estudiantes",
  editar_estudiantes: "Editar los datos de estudiantes",
  editar_notas: "Agregar, editar y quitar notas",
  eliminar: "Eliminar estudiantes",
  exportar: "Exportar a CSV",
  gestionar_alumnos: "Crear cuentas y administrar a sus alumnos",
  gestionar_cursos: "Agregar, renombrar y quitar cursos de la institución",
};
const PERMISOS_ALUMNO = ["ver_companeros", "ver_notas_companeros", "ver_estadisticas"];

/* ===== Utilidades ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => n.toFixed(2);
const media = v => v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0;
const mediaPond = ns => { const s = ns.reduce((a, n) => a + n.peso, 0); return s ? ns.reduce((a, n) => a + n.v * n.peso, 0) / s : 0; };   // promedio ponderado por peso
const abrevCurso = n => { if (n.length <= 8) return n; const w = n.split(/\s+/).filter(x => x.length > 2); return w.length > 1 ? w.map(x => x[0]).join("").toUpperCase().slice(0, 5) : n.slice(0, 7) + "."; };
const abrevPer = p => !p ? "?" : p.nombre.length > 11 ? p.nombre.slice(0, 10) + "…" : p.nombre;
const convertirDouble = t => { t = String(t).trim(); return t !== "" && !isNaN(Number(t)) ? Number(t) : null; };
const notaValida = v => v !== null && v >= NOTA_MIN && v <= NOTA_MAX;
const nombreValido = n => n !== "" && !n.includes("|") && !/\d/.test(n);
const codigoValido = c => c !== "" && c.length <= 15 && /^[A-Za-z0-9]+$/.test(c);
const nombreCompleto = p => `${p.nombres} ${p.apellidos || ""}`.trim();
const COLORS = ["#e08a5c", "#8b3df0", "#0e9aa7", "#1f6feb", "#10b981", "#d946ef"];
const avatarDe = (texto, clave) => { let h = 0; for (const c of String(clave)) h += c.charCodeAt(0);
  const ini = String(texto).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  return `<div class="av" style="background:${COLORS[h % COLORS.length]}">${esc(ini)}</div>`; };
let tt; function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 3200); }
const guardarLocal = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
const leerLocal = k => { try { return localStorage.getItem(k); } catch { return null; } };
async function copiar(texto) {
  try { await navigator.clipboard.writeText(texto); toast("Copiado."); }
  catch { const t = document.createElement("textarea"); t.value = texto; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); toast("Copiado."); }
}
function setTema(t) { document.documentElement.dataset.theme = t; guardarLocal("tema", t); }
const temaActual = () => document.documentElement.dataset.theme;

/* ===== Conexión con Supabase ===== */
let sesion = null;
try { sesion = JSON.parse(leerLocal("sesion")); } catch {}
function fijarSesion(j) {
  sesion = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in - 30) * 1000 };
  guardarLocal("sesion", JSON.stringify(sesion));
}
function cerrarSesionLocal() { sesion = null; guardarLocal("sesion", null); }
async function refrescar() {
  if (!sesion || !sesion.refresh_token) throw new Error("Tu sesión expiró. Inicia sesión de nuevo.");
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
    method: "POST", headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: sesion.refresh_token }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { cerrarSesionLocal(); throw new Error("Tu sesión expiró. Inicia sesión de nuevo."); }
  fijarSesion(j);
}
function traducirError(j, status) {
  const m = (j && (j.message || j.msg || j.error_description || j.error)) || "";
  if (j && j.code === "23505") return "Ya existe un registro con esos datos (código repetido).";
  if (j && j.code === "23514") return "Datos inválidos: revisa código, nombre y notas (0–20).";
  if (j && (j.code === "42501" || /row-level security/i.test(m))) return "No tienes permiso para esta acción.";
  if (/Invalid login credentials/i.test(m)) return "Usuario o contraseña incorrectos.";
  if (/Email not confirmed/i.test(m)) return "Supabase exige confirmar el correo. Desactiva «Confirm email» en Authentication → Providers → Email.";
  if (/Database error saving new user/i.test(m)) return "Usuario o código de activación inválido, o la cuenta ya fue activada.";
  if (/email.*(invalid|not valid)|invalid.*email/i.test(m)) return "Supabase rechazó el correo interno de la cuenta. Avisa al administrador del sistema.";
  if (/at least \d+ characters|Password should/i.test(m)) return "La contraseña debe tener al menos 6 caracteres.";
  return m || `Error del servidor (${status}).`;
}
async function http(ruta, { method = "GET", body, headers } = {}, reintento = false) {
  if (sesion && Date.now() > sesion.expires_at) await refrescar();
  const cab = { apikey: SUPABASE_KEY, "Content-Type": "application/json", ...headers };
  if (sesion) cab.Authorization = `Bearer ${sesion.access_token}`;
  let r;
  try { r = await fetch(SUPABASE_URL + ruta, { method, headers: cab, body: body === undefined ? undefined : JSON.stringify(body) }); }
  catch { throw new Error("No se pudo conectar con el servidor. Revisa tu conexión a internet."); }
  const txt = await r.text();
  let j = null; try { j = txt ? JSON.parse(txt) : null; } catch {}
  if (r.status === 401 && sesion && !reintento) { await refrescar(); return http(ruta, { method, body, headers }, true); }
  if (!r.ok) throw new Error(traducirError(j, r.status));
  return j;
}
const rpc = (fn, args = {}) => http(`/rest/v1/rpc/${fn}`, { method: "POST", body: args });
const sel = q => http(`/rest/v1/${q}`);
const emailDe = u => `${u.trim().toLowerCase()}@${EMAIL_DOMINIO}`;

async function authPost(ruta, cuerpo) {
  let r;
  try { r = await fetch(SUPABASE_URL + ruta, { method: "POST", headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) }); }
  catch { throw new Error("No se pudo conectar con el servidor. Revisa tu conexión a internet."); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(traducirError(j, r.status));
  return j;
}
async function iniciarSesion(usuario, clave) {
  fijarSesion(await authPost("/auth/v1/token?grant_type=password", { email: emailDe(usuario), password: clave }));
}
async function activarCuenta(usuario, codigo, clave) {
  cerrarSesionLocal();
  const info = await rpc("verificar_activacion", { p_usuario: usuario, p_codigo: codigo });
  if (!info) throw new Error("Usuario o código incorrecto, o la cuenta ya fue activada.");
  const j = await authPost("/auth/v1/signup", { email: emailDe(usuario), password: clave, data: { usuario: usuario.trim().toLowerCase(), codigo } });
  if (j.access_token) fijarSesion(j); else await iniciarSesion(usuario, clave);
}

/* ===== Modelo ===== */
// Las notas son una lista plana [{id, curso, periodo, v, peso}]. Todos los cálculos aceptan un periodo (trimestre/ciclo);
// por defecto usan el filtro elegido en pantalla (periodoSel) y null significa «todos los periodos».
class Estudiante {
  constructor(d) {
    this.id = d.id; this.codigo = d.codigo; this.nombre = d.nombre; this.docente_id = d.docente_id;
    this.perfil_id = d.perfil_id; this.institucion_id = d.institucion_id;
    this.notas = (d.notas || []).map(n => ({ id: n.id, curso: n.curso_id, periodo: n.periodo_id, v: Number(n.nota), peso: n.peso || 1,
      titulo: n.titulo || "", comentario: (n.notas_detalle && n.notas_detalle.comentario) || "" })).sort((a, b) => a.id - b.id);
  }
  de(per) { return per ? this.notas.filter(n => n.periodo === per) : this.notas; }
  deCurso(c, per = periodoSel) { return this.de(per).filter(n => n.curso === c); }
  totalNotas(per = periodoSel) { return this.de(per).length; }
  promedioCurso(c, per = periodoSel) { return mediaPond(this.deCurso(c, per)); }
  promedio(per = periodoSel) { const cs = [...new Set(this.de(per).map(n => n.curso))]; return cs.length ? media(cs.map(c => this.promedioCurso(c, per))) : 0; }
  aprobado(per = periodoSel) { return this.totalNotas(per) > 0 && this.promedio(per) >= NOTA_APROBACION; }
  estado(per = periodoSel) { return !this.totalNotas(per) ? "Sin notas" : this.aprobado(per) ? "Aprobado" : "Reprobado"; }
}

/* ===== Estado ===== */
let yo = null, permisos = {};
let est = [], perfiles = [], insts = [], solic = [], invs = [], cursos = [], periodos = [];
let vista = "panel", orden = 0, filtro = "", detalleId = null, borrador = [], kBorr = 0, periodoSel = null;
let tabLogin = "ingresar", instSel = null, avisoCarga = "", estadoSis = null;
const esUni = () => !!(yo && yo.institucion && yo.institucion.tipo === "universidad");
const cursosDe = id => cursos.filter(c => c.institucion_id === id);
const periodosDe = id => periodos.filter(p => p.institucion_id === id);
const cursoDe = id => cursos.find(c => c.id === id);
const periodoDe = id => periodos.find(p => p.id === id);
const miCursos = () => yo && yo.institucion ? cursosDe(yo.institucion.id) : [];
const misPeriodos = () => yo && yo.institucion ? periodosDe(yo.institucion.id) : [];
const nomPeriodos = tipo => tipo === "universidad" ? "ciclos" : "trimestres";   // nombre del periodo según el tipo de institución
const nomPeriodo = tipo => tipo === "universidad" ? "Ciclo" : "Trimestre";
const tituloConfig = () => esUni() ? "Cursos" : `Cursos y ${nomPeriodos(yo.institucion.tipo)}`;   // las universidades tienen 14 ciclos fijos
const puedeCursos = () => !!yo && (yo.rol === "admin" || (yo.rol === "docente" && permisos.gestionar_cursos));
const esStaff = () => yo && (yo.rol === "admin" || yo.rol === "docente");
const puedeGestionar = () => yo && (yo.rol === "dueno" || yo.rol === "admin" || (yo.rol === "docente" && permisos.gestionar_alumnos));
const buscarPorCodigo = c => est.find(e => e.codigo.toUpperCase() === c.trim().toUpperCase()) || null;
const perfilDe = id => perfiles.find(p => p.id === id);

const SEL_EST = "estudiantes?select=id,codigo,nombre,docente_id,perfil_id,institucion_id,notas(id,curso_id,periodo_id,nota,peso,titulo,notas_detalle(comentario))&order=id";

/* ===== Gráficos ===== */
function donut(a, b, ca, cb) {
  const t = a + b, r = 52, C = 2 * Math.PI * r, pa = t ? a / t : 0;
  return `<svg viewBox="0 0 140 140" width="150" height="150" style="display:block;margin:auto">
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="${cb}" stroke-width="24"/>
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="${ca}" stroke-width="24" stroke-dasharray="${pa * C} ${C}" transform="rotate(-90 70 70)"/>
    <text x="70" y="75" text-anchor="middle" font-size="20" font-weight="700" style="fill:var(--ink)">${t ? Math.round(pa * 100) : 0}%</text></svg>`;
}
function bars(lista) {
  const data = lista.filter(e => e.totalNotas());
  if (!data.length) return `<div class="empty">Sin datos</div>`;
  const w = Math.max(280, data.length * 46), h = 170;
  return `<svg viewBox="0 0 ${w} ${h + 22}" width="100%" style="max-height:220px">` +
    [0, NOTA_MAX / 2, NOTA_MAX].map(v => `<line x1="0" x2="${w}" y1="${h - v * h / NOTA_MAX}" y2="${h - v * h / NOTA_MAX}" style="stroke:var(--line)"/><text x="0" y="${h - v * h / NOTA_MAX - 2}" font-size="9" style="fill:var(--mute)">${v}</text>`).join("") +
    data.map((e, i) => { const p = e.promedio(), bh = p * h / NOTA_MAX, x = 20 + i * 44;
      return `<rect x="${x}" y="${h - bh}" width="26" height="${bh}" rx="3" fill="${e.aprobado() ? "#0e9aa7" : "#8b3df0"}"/>
      <text x="${x + 13}" y="${h + 13}" font-size="9" text-anchor="middle" style="fill:var(--mute)">${esc(e.codigo.slice(0, 6))}</text>`; }).join("") + `</svg>`;
}
const leyenda = `<div class="legend"><span><i style="background:#0e9aa7"></i>Aprobados</span><span><i style="background:#c9a8f7"></i>Reprobados</span></div>`;
function stats(lista) {
  let aprobados = 0, conNotas = 0, suma = 0;
  for (const e of lista) { if (!e.totalNotas()) continue; conNotas++; suma += e.promedio(); if (e.aprobado()) aprobados++; }
  const mapa = new Map();   // promedio por curso (agrupado por nombre, así sirve también al dueño con varias instituciones)
  for (const e of lista) for (const c of new Set(e.de(periodoSel).map(n => n.curso))) {
    const cu = cursoDe(c); if (!cu) continue;
    const k = cu.nombre.toLowerCase(); if (!mapa.has(k)) mapa.set(k, { nombre: cu.nombre, ps: [] }); mapa.get(k).ps.push(e.promedioCurso(c));
  }
  const porCurso = [...mapa.values()].map(x => ({ nombre: x.nombre, prom: media(x.ps) }));
  return { total: lista.length, conNotas, aprobados, reprobados: conNotas - aprobados, general: conNotas ? suma / conNotas : null, porCurso };
}
const kpisHTML = s => `<div class="kpis">
  <div class="kpi"><span>Total de estudiantes</span><b>${s.total}</b></div>
  <div class="kpi"><span>Con calificaciones</span><b>${s.conNotas}</b></div>
  <div class="kpi"><span>Aprobados (≥ ${NOTA_APROBACION})</span><b style="color:var(--green)">${s.aprobados}</b></div>
  <div class="kpi"><span>Reprobados</span><b style="color:var(--red)">${s.reprobados}</b></div></div>`;
const pill = e => `<span class="pill ${e.totalNotas() ? (e.aprobado() ? "ok" : "no") : "na"}">${e.estado()}</span>`;

/* ===== Tablas ===== */
function filas(lista, { acciones = true, soloNombres = false } = {}) {
  if (!lista.length) return `<div class="empty">No hay estudiantes para mostrar.</div>`;
  const verInst = yo.rol === "dueno", verDoc = yo.rol === "admin" || yo.rol === "dueno";
  const puedeBorrar = esStaff() && permisos.eliminar, puedeEditar = esStaff();
  const cols = yo.rol === "dueno" ? [] : miCursos();   // el dueño ve varias instituciones: sin columnas por curso
  return `<div class="scroll"><table><thead><tr><th>Estudiante</th>${verInst ? "<th>Institución</th>" : ""}${verDoc ? "<th>Docente</th>" : ""}` +
    (soloNombres ? "" : `<th>Notas</th>${cols.map(c => `<th title="${esc(c.nombre)}">${esc(abrevCurso(c.nombre))}</th>`).join("")}<th>${esUni() ? "Prom. ponderado" : "Promedio"}</th><th>Estado</th>`) +
    `${acciones ? "<th></th>" : ""}</tr></thead><tbody>` +
    lista.map(e => { const d = perfilDe(e.docente_id), i = instDe(e.institucion_id);
      return `<tr><td><div class="who">${avatarDe(e.nombre, e.codigo)}<div>${esc(e.nombre)}<small>${esc(e.codigo)}</small></div></div></td>
      ${verInst ? `<td>${i ? esc(i.nombre) : "—"}</td>` : ""}${verDoc ? `<td>${d ? esc(nombreCompleto(d)) : "<small>Sin docente</small>"}</td>` : ""}` +
      (soloNombres ? "" : `<td>${e.totalNotas()}</td>${cols.map(c => `<td>${e.deCurso(c.id).length ? fmt(e.promedioCurso(c.id)) : "<small>–</small>"}</td>`).join("")}
      <td><b>${fmt(e.promedio())}</b></td><td>${pill(e)}</td>`) +
      (acciones ? `<td style="white-space:nowrap"><button class="btn sm sec" data-a="ver" data-id="${e.id}">${puedeEditar ? "Ver / editar" : "Ver"}</button>${puedeBorrar ? ` <button class="btn del" data-a="borrar-est" data-id="${e.id}">Eliminar</button>` : ""}</td>` : "") + `</tr>`; }).join("") + `</tbody></table></div>`;
}
// Una nota como etiqueta: «v» o «v ×peso»; con todos los periodos a la vista también muestra a cuál pertenece
const pesoTxt = n => n.peso > 1 ? `<sup>×${n.peso}</sup>` : "";
const corto = (t, m) => t.length > m ? t.slice(0, m - 1) + "…" : t;
const tituloNota = n => n.titulo ? `<small>${esc(corto(n.titulo, 16))}</small> ` : "";
const notaChip = (n, extra = "", mostrarPer = !periodoSel) => `<span class="note" title="${esc([n.titulo, n.comentario].filter(Boolean).join(" — "))}">${mostrarPer ? `<small>${esc(abrevPer(periodoDe(n.periodo)))}</small> ` : ""}${tituloNota(n)}${n.v}${pesoTxt(n)}${n.comentario ? " 💬" : ""}${extra}</span>`;
// Tarjeta de un curso con sus notas y los campos para agregar una (nombre, nota, peso y comentario)
const tarjetaCurso = (c, chips, prom, accion) => `<div class="curso"><h3>${esc(c.nombre)}<small>${prom}</small></h3>
  <div class="chips">${chips || "<em>Sin notas</em>"}</div>
  <input data-titulo="${c.id}" maxlength="60" placeholder="Nombre (examen, trabajo…)" aria-label="Nombre de la nota de ${esc(c.nombre)}">
  <div class="add"><input data-nota="${c.id}" inputmode="decimal" placeholder="Nota (0–20)" aria-label="Nueva nota de ${esc(c.nombre)}">${esUni() ? pesoSelect(`data-peso="${c.id}"`) : ""}<button type="button" class="btn" data-a="${accion}" data-c="${c.id}">+</button></div>
  <input data-coment="${c.id}" maxlength="500" placeholder="Comentario (opcional)" aria-label="Comentario de la nota de ${esc(c.nombre)}"></div>`;
// Lista detallada de calificaciones (nombre, nota, peso y comentario): la ve el alumno en «Mis comentarios»
function listaNotas(e) {
  const cs = cursosDe(e.institucion_id), orden = new Map(cs.map((c, i) => [c.id, i]));
  const ns = e.de(periodoSel).slice().sort((a, b) => (orden.get(a.curso) - orden.get(b.curso)) || a.id - b.id);
  if (!ns.length) return `<div class="empty">Aún no hay calificaciones registradas.</div>`;
  return `<div class="scroll"><table><thead><tr><th>Curso</th><th>${nomPeriodo(yo.institucion.tipo)}</th><th>Nombre</th><th>Nota</th>${esUni() ? "<th>Peso</th>" : ""}<th>Comentario</th></tr></thead><tbody>` +
    ns.map(n => { const c = cursoDe(n.curso), p = periodoDe(n.periodo);
      return `<tr><td>${c ? esc(c.nombre) : "—"}</td><td>${p ? esc(p.nombre) : "—"}</td><td>${n.titulo ? esc(n.titulo) : "<small>—</small>"}</td><td><span class="note">${n.v}</span></td>${esUni() ? `<td>${n.peso}</td>` : ""}<td>${n.comentario ? esc(n.comentario) : "<small>—</small>"}</td></tr>`; }).join("") + `</tbody></table></div>`;
}
const pesoSelect = attr => `<select ${attr} title="Peso de la nota (si no eliges, vale 1)" style="width:84px">${PESOS.map(p => `<option value="${p}">Peso ${p}</option>`).join("")}</select>`;
function selPeriodo() {
  const ps = misPeriodos(); if (!ps.length) return "";
  return `<select id="perSel" title="Ver notas de un ${nomPeriodo(yo.institucion.tipo).toLowerCase()}"><option value="">Todos los ${nomPeriodos(yo.institucion.tipo)}</option>${ps.map(p => `<option value="${p.id}" ${p.id === periodoSel ? "selected" : ""}>${esc(p.nombre)}</option>`).join("")}</select>`;
}
function resumenPeriodos(e) {
  const ps = periodosDe(e.institucion_id); if (ps.length < 2) return "";
  return `<div class="chips" style="margin-top:10px">${ps.map(p => `<span class="chip ${p.id === periodoSel ? "on" : ""}">${esc(p.nombre)}: <b>${e.totalNotas(p.id) ? fmt(e.promedio(p.id)) : "–"}</b></span>`).join("")}</div>`;
}
function detalleTabla(e) {
  const cs = cursosDe(e.institucion_id);
  return `<div class="scroll"><table><thead><tr><th>Curso</th><th>Calificaciones</th><th>${esUni() ? "Prom. ponderado" : "Promedio"}</th></tr></thead><tbody>` +
    (cs.map(c => { const v = e.deCurso(c.id); return `<tr><td>${esc(c.nombre)}</td><td>${v.length ? v.map(n => notaChip(n)).join("") : "<small>(sin notas)</small>"}</td><td>${v.length ? `<b>${fmt(mediaPond(v))}</b>` : "–"}</td></tr>`; }).join("")
      || `<tr><td colspan="3"><small>Aún no hay cursos.</small></td></tr>`) + `</tbody></table></div>${resumenPeriodos(e)}`;
}

/* ===== Borrador de notas (registro) ===== */
function cursosHTML() {
  const cs = miCursos();
  if (!cs.length) return `<div class="empty">Aún no hay cursos. Agrégalos en «${tituloConfig()}».</div>`;
  return cs.map(c => { const ns = borrador.filter(n => n.curso === c.id);
    return tarjetaCurso(c, ns.map(n => `<span class="note rm" data-a="b-rm" data-k="${n.k}" title="Quitar${n.comentario ? " · " + esc(n.comentario) : ""}">${esc(abrevPer(periodoDe(n.periodo)))} · ${tituloNota(n)}${n.v}${pesoTxt(n)}${n.comentario ? " 💬" : ""}</span>`).join(""),
      ns.length ? "prom. " + fmt(mediaPond(ns)) : "sin notas", "b-add"); }).join("");
}
// Lee los campos de una tarjeta de curso; devuelve null (y muestra el error) si la nota no es válida
function leerTarjeta(c) {
  const err = $("#err"), v = convertirDouble($(`[data-nota="${c}"]`).value), ps = $(`[data-peso="${c}"]`);
  if (!notaValida(v)) { err.textContent = `${cursoDe(c).nombre}: la calificación debe ser un número entre ${NOTA_MIN} y ${NOTA_MAX}.`; $(`[data-nota="${c}"]`).focus(); return null; }
  return { v, peso: ps ? Number(ps.value) : 1, titulo: $(`[data-titulo="${c}"]`).value.trim(), comentario: $(`[data-coment="${c}"]`).value.trim() };
}
function repintarCursos(foco) { $("#cursosReg").innerHTML = cursosHTML(); if (foco !== undefined) $(`[data-nota="${foco}"]`).focus(); }
function agregarBorrador(c) {
  const err = $("#err"), per = Number($("#perReg").value), cu = cursoDe(c), t = leerTarjeta(c); if (!t) return;
  if (!per) { err.textContent = "Elige el periodo de la nota."; return; }
  if (borrador.filter(n => n.curso === c && n.periodo === per).length >= MAX_NOTAS) { err.textContent = `${cu.nombre}: máximo ${MAX_NOTAS} calificaciones por periodo.`; return; }
  err.textContent = ""; borrador.push({ k: ++kBorr, curso: c, periodo: per, ...t }); repintarCursos(c);
}

/* ===== Agregar calificaciones a un estudiante existente (tarjetas por curso) ===== */
let calEstId = null;
const calEstudiante = () => { const i = $("#calCodigo"); return i && i.value.trim() ? buscarPorCodigo(i.value) : null; };
function calPeriodo() { const s = $("#perCal"); return s ? Number(s.value) : 0; }
function cursosCalHTML() {
  const cs = miCursos(), e = calEstudiante(), per = calPeriodo();
  if (!cs.length) return `<div class="empty">Aún no hay cursos. Agrégalos en «${tituloConfig()}».</div>`;
  return cs.map(c => { const ns = e ? e.deCurso(c.id, per) : [];
    return tarjetaCurso(c, ns.map(n => notaChip(n, "", false)).join(""), ns.length ? "prom. " + fmt(mediaPond(ns)) : "sin notas", "c-add"); }).join("");
}
function repintarCal(foco) {
  const e = calEstudiante(); calEstId = e ? e.id : null;
  $("#cursosCal").innerHTML = cursosCalHTML();
  $("#calInfo").innerHTML = e ? `✔ <b>${esc(e.nombre)}</b> · ${esc(e.codigo)}` : ($("#calCodigo").value.trim() ? "No se encontró ningún estudiante con ese código." : "Escribe el código del estudiante para ver y agregar sus notas.");
  $("#calInfo").className = e ? "msg" : "msg warn";
  if (foco !== undefined) $(`[data-nota="${foco}"]`).focus();
}
async function agregarCal(c) {
  const err = $("#err"), e = calEstudiante(), per = calPeriodo(); err.textContent = "";
  if (!e) { err.textContent = "Escribe el código de un estudiante existente."; $("#calCodigo").focus(); return; }
  if (!per) { err.textContent = "Elige el periodo de la nota."; return; }
  const t = leerTarjeta(c); if (!t) return;
  try { await rpc("agregar_nota", { p_estudiante: e.id, p_curso: c, p_periodo: per, p_nota: t.v, p_peso: t.peso, p_titulo: t.titulo || null, p_comentario: t.comentario || null }); }
  catch (x) { err.textContent = x.message; return; }
  await recargarEst(); repintarCal(c);
  const act = est.find(x => x.id === e.id);
  toast(`Calificación agregada. Promedio en ${cursoDe(c).nombre} (${periodoDe(per).nombre}): ${fmt(act.promedioCurso(c, per))} | General: ${fmt(act.promedio(per))}`);
}

function vLista() {

async function conBoton(f, fn) {

  const card = f.closest(".card"), err = f.querySelector(".err") || (card && card.querySelector(".err")) || $("#err") || $("#errDet");
  if (btn) btn.disabled = true; if (err) err.textContent = "";
  try { await fn(err || { textContent: "" }); } catch (e) { if (err) err.textContent = e.message; else toast(e.message); } finally { if (btn && btn.isConnected) btn.disabled = false; }
}

      if (!instSel) falla("Busca y elige tu institución de la lista.");
      await rpc("solicitar_afiliacion", { p_institucion: instSel.id, p_nombres: d.nombres, p_apellidos: d.apellidos, p_rol: d.rol });
      f.innerHTML = `<p class="msg">✔ Solicitud enviada a <b>${esc(instSel.nombre)}</b>. Cuando te aprueben, tu administrador te dará un usuario y un código para activar tu cuenta.</p>`;
    } else if (f.id === "fReg") {
      const codigo = d.codigo.trim(), nombre = d.nombre.trim();
      if (!codigoValido(codigo)) falla("Código inválido (solo letras/números, máx. 15).");
      if (buscarPorCodigo(codigo)) falla("Ya existe un estudiante con ese código.");
      if (!nombreValido(nombre)) falla("El nombre no puede estar vacío ni contener números o '|'.");
      await rpc("registrar_estudiante", { p_codigo: codigo, p_nombre: nombre, p_docente: d.docente || null,
        p_notas: borrador.map(n => ({ curso: n.curso, periodo: n.periodo, nota: n.v, peso: n.peso, titulo: n.titulo, comentario: n.comentario })) });
      await recargarEst(); toast("Estudiante registrado y guardado."); vista = "lista"; render();
    } else if (f.id === "fNota") {
      const v = convertirDouble(d.nota); if (!notaValida(v)) falla(`La calificación debe ser un número entre ${NOTA_MIN} y ${NOTA_MAX}.`);
      const peso = d.peso ? Number(d.peso) : (f.dataset.id ? null : 1), titulo = (d.titulo || "").trim() || null, comentario = (d.comentario || "").trim() || null;
      if (f.dataset.id) await rpc("actualizar_nota", { p_id: Number(f.dataset.id), p_nota: v, p_peso: peso, p_titulo: titulo, p_comentario: comentario });
      else {
        if (!d.periodo) falla("Elige el periodo de la nota.");
        await rpc("agregar_nota", { p_estudiante: detalleId, p_curso: Number(f.dataset.curso), p_periodo: Number(d.periodo), p_nota: v, p_peso: peso, p_titulo: titulo, p_comentario: comentario });
      }
      await recargarEst(); renderDetalle(); render(); toast("Calificación guardada.");
    } else if (f.id === "fBus") {
      const e = buscarPorCodigo(d.codigo);
      $("#res").innerHTML = e ? filas([e], { acciones: true }) + detalleTabla(e) : `<div class="empty">No se encontró ningún estudiante con ese código.</div>`;
    } else if (f.id === "fEstDet") {
      const codigo = d.codigo.trim(), nombre = d.nombre.trim();
      if (!codigoValido(codigo)) falla("Código inválido (solo letras/números, máx. 15).");
      if (!nombreValido(nombre)) falla("El nombre no puede estar vacío ni contener números o '|'.");
      await rpc("actualizar_estudiante", { p_id: detalleId, p_codigo: codigo, p_nombre: nombre }); await recargarEst(); renderDetalle(); render(); toast("Datos actualizados.");
    } else if (f.id === "fPerm") {
      const p = perfilDe(f.dataset.id), nuevos = {};
      for (const k of (p.rol === "alumno" ? PERMISOS_ALUMNO : Object.keys(PERMISOS))) nuevos[k] = f.elements[k].checked;
      await rpc("actualizar_permisos", { p_perfil: p.id, p_permisos: nuevos }); cerrarDlg(); await recargarTodo(); toast("Permisos guardados.");
    } else if (f.id === "fInv") {
      const v = await rpc("crear_invitacion", { p_rol: d.rol, p_nombres: d.nombres, p_apellidos: d.apellidos || "",
        p_institucion: d.inst ? Number(d.inst) : null, p_docente: d.rol === "alumno" && d.docente ? d.docente : null });
      await recargarTodo(); mostrarCredenciales(v);
    } else if (f.id === "fInst") {
      await rpc("crear_institucion", { p_nombre: d.nombre, p_vence: d.vence || null, p_tipo: d.tipo }); await recargarTodo(); toast("Institución creada. Ahora crea su administrador.");
    } else if (f.id === "fMant") {
      const pausar = !yo.mantenimiento;
      if (pausar && !confirm("¿Pausar el sistema? Nadie más que tú podrá entrar ni usarlo hasta que lo reanudes.")) return;
      await rpc("poner_mantenimiento", { p_activo: pausar, p_mensaje: d.mensaje || null });
      yo = await rpc("mi_sesion"); render(); toast(pausar ? "Sistema en pausa." : "Sistema reanudado.");
    } else if (f.id === "fCurso") {
      await rpc("crear_curso", { p_nombre: d.nombre }); await recargarTodo(); toast("Curso agregado.");
    } else if (f.id === "fPeriodo") {
      await rpc("crear_periodo", { p_nombre: d.nombre }); await recargarTodo(); toast("Agregado.");
    } else if (f.id === "fPass") {
      if (d.a !== d.b) falla("Las contraseñas no coinciden.");
      await http("/auth/v1/user", { method: "PUT", body: { password: d.a } }); f.reset(); toast("Contraseña cambiada.");
    }
  });
});

/* ===== CSV (una fila por nota: codigo,nombre,periodo,curso,nota,peso,titulo,comentario) ===== */
function filaCSV(linea, sep) {
  const r = []; let c = "", q = false;
  for (let i = 0; i < linea.length; i++) {
    const ch = linea[i];
    if (q) { if (ch === '"') { if (linea[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { r.push(c); c = ""; }
    else c += ch;
  }
  r.push(c); return r;
}
function desdeCSV(texto) {
  const lineas = texto.replace(/^﻿/, "").split(/\r?\n/).filter(l => l.trim());
  const lista = []; let omitidas = 0;
  if (!lineas.length) return { lista, omitidas };
  const sep = lineas[0].includes(",") ? "," : ";";
  const porCodigo = new Map();   // codigo -> { codigo, nombre, notas, ok }
  const cs = miCursos(), ps = misPeriodos();
  for (const l of lineas.slice(/^codigo/i.test(lineas[0].trim()) ? 1 : 0)) {
    const f = filaCSV(l, sep).map(x => x.trim()), codigo = f[0] || "", nombre = f[1] || "", k = codigo.toUpperCase();
    if (!codigoValido(codigo) || !nombreValido(nombre)) { omitidas++; continue; }
    if (!porCodigo.has(k)) porCodigo.set(k, { codigo, nombre, notas: [], ok: true });
    const r = porCodigo.get(k);
    if (!f[2] && !f[3] && !f[4]) continue;   // estudiante sin notas
    const per = ps.find(p => p.nombre.toLowerCase() === f[2].toLowerCase()), cu = cs.find(c => c.nombre.toLowerCase() === f[3].toLowerCase());
    const nota = convertirDouble((f[4] || "").replace(",", ".")), peso = f[5] ? Number(f[5]) : 1;
    if (!per || !cu || !notaValida(nota) || !Number.isInteger(peso) || peso < 1 || peso > 10) { r.ok = false; continue; }
    if ((f[6] || "").length > 60 || (f[7] || "").length > 500) { r.ok = false; continue; }
    r.notas.push({ curso: cu.id, periodo: per.id, nota, peso, titulo: f[6] || "", comentario: f[7] || "" });
  }
  for (const r of porCodigo.values()) {
    const maxPor = Math.max(0, ...Object.values(r.notas.reduce((m, n) => { const k = n.curso + "-" + n.periodo; m[k] = (m[k] || 0) + 1; return m; }, {})));
    if (r.ok && maxPor <= MAX_NOTAS) lista.push(r); else omitidas++;
  }
  return { lista, omitidas };
}

(async function arrancar() {
  render();
  cargarEstadoSistema();
  if (sesion) {
    try { await entrar(); } catch (e) { cerrarSesionLocal(); yo = null; toast(e.message); }
    render();
  }
})();
