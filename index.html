<script>
/* ===== Configuración ===== */
const SUPABASE_URL = "https://tikpnokwqkofitguvpdx.supabase.co";
const SUPABASE_KEY = "sb_publishable_jJgmXkQMlB2UH-E70KOvYg_sjQz-xwH"; // clave pública (publishable): es pública por diseño
const EMAIL_DOMINIO = "acceso.estudiantil.app"; // correo interno de las cuentas (usuario@dominio); debe coincidir con config.email_dominio en la base

 *   5. Pega la URL (termina en /exec) y la clave en la pantalla «Correo institucional» del sistema.
 */

function doPost(e) {
  try {

    if (!d.para) return respuesta(cuenta && cuenta.ok ? "cuenta creada" : "sin destinatario");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.para)) return respuesta("correo invalido");

    const inst = limpiar(d.institucion) || "tu institución";

      '<table style="border-collapse:collapse;margin:12px 0">' + filas + '</table>' + aviso +
      '<ol style="line-height:1.7"><li>Abre el sistema' + (app ? ' (<a href="' + app + '">' + app + '</a>)' : '') + ' o la app.</li>' +
      '<li>Entra en <b>Activar cuenta</b>.</li>' +
      '<li>Escribe tu usuario (' + limpiar(d.usuario) + ') y el código, y elige tu contraseña.</li></ol>' +

    const texto = "Hola " + d.nombre + ",\n" + inst + " creó tu cuenta de " + rol + ".\n\nUsuario: " + (d.correo_institucional || d.usuario) +

    return respuesta("error: " + err);

}

/** Crea la cuenta de Google Workspace usuario@dominio con contraseña temporal. Nunca lanza: avisa al director si falla. */
function crearCuentaGoogle(d) {
  const correo = String(d.correo_institucional || "").toLowerCase();
  try {
    const yo = Session.getEffectiveUser().getEmail().toLowerCase();
    const dominio = yo.split("@")[1];
    if (!/^[a-z0-9._'-]+@[a-z0-9.-]+\.[a-z]{2,}$/.test(correo)) throw new Error("correo institucional no válido: " + correo);
    // Solo se crean cuentas del dominio de la cuenta que publicó el script (evita usos indebidos)
    if (correo.split("@")[1] !== dominio) throw new Error("el dominio de " + correo + " no coincide con el de la cuenta que publicó el script (" + dominio + ")");
    if (String(d.clave_google || "").length < 8) throw new Error("falta la contraseña temporal");
    const nombres = String(d.nombres || d.nombre || "").trim() || "Usuario";
    const apellidos = String(d.apellidos || "").trim() || "-";
    try {
      AdminDirectory.Users.insert({
        primaryEmail: correo,
        name: { givenName: nombres, familyName: apellidos },
        password: d.clave_google,
        changePasswordAtNextLogin: true
      });
    } catch (err) {
      if (/already exists/i.test(String(err))) { avisarAlDirector("La cuenta " + correo + " ya existía", "No se creó otra. Si es una persona distinta, regístrala con otro usuario."); return { ok: false, existe: true, correo: correo }; }
      throw err;
    }
    return { ok: true, correo: correo };
  } catch (err) {
    avisarAlDirector("No se pudo crear la cuenta de Google " + correo,
      String(err) + "\n\nComprueba que: (1) este script lo publicó una cuenta administradora de Google Workspace, (2) agregaste el servicio «Admin SDK API» en el editor de Apps Script, " +
      "y (3) el acceso a la API está permitido en la consola de administración (Seguridad > Controles de API).");
    return { ok: false, error: String(err), correo: correo };
  }
}

function avisarAlDirector(asunto, detalle) {
  try { MailApp.sendEmail(Session.getEffectiveUser().getEmail(), "[SINEVA] " + asunto, detalle); } catch (e) {}
}

// Respuesta de prueba al abrir la URL en el navegador

function fila(k, v) { return '<tr><td style="padding:6px 14px 6px 0;color:#6b7280">' + k + '</td><td style="padding:6px 0">' + v + '</td></tr>'; }

const cmpVer = (a, b) => { const x = String(a).split(".").map(Number), y = String(b).split(".").map(Number); for (let i = 0; i < 3; i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; } return 0; };

function traducirError(j, status) {
  const m = (j && (j.message || j.msg || j.error_description || j.error)) || "";
  if (j && j.code === "23505") return "Ya existe un registro con esos datos (código repetido).";
  if (j && j.code === "23514") return "Datos inválidos: revisa código, nombre y notas (0–20).";
  if (j && (j.code === "42501" || /row-level security/i.test(m))) return "No tienes permiso para esta acción.";
  if (/Invalid login credentials/i.test(m)) return "Usuario o contraseña incorrectos.";
  if (/Email not confirmed/i.test(m)) return "Supabase exige confirmar el correo. Desactiva «Confirm email» en Authentication → Providers → Email.";
  if (/Database error saving new user/i.test(m)) return "Usuario o código de activación inválido, o la cuenta ya fue activada.";
  if (/email.*(invalid|not valid)|invalid.*email/i.test(m)) return "Supabase rechazó el correo interno de la cuenta. Avisa al administrador del sistema.";
  if (/at least \d+ characters|Password should|weak|pwned|leaked/i.test(m)) return "La contraseña debe tener al menos 8 caracteres, con letras y números, y no ser una contraseña muy común.";
  return m || `Error del servidor (${status}).`;
}
async function http(ruta, { method = "GET", body, headers } = {}, reintento = false) {
  if (sesion && Date.now() > sesion.expires_at) await refrescar();
  const cab = { apikey: SUPABASE_KEY, "Content-Type": "application/json", ...headers };
  if (sesion) cab.Authorization = `Bearer ${sesion.access_token}`;
  let r;
  try { r = await fetch(SUPABASE_URL + ruta, { method, headers: cab, body: body === undefined ? undefined : JSON.stringify(body) }); }
  catch { throw new Error("No se pudo conectar con el servidor. Revisa tu conexión a internet."); }
  const txt = await r.text();
  let j = null; try { j = txt ? JSON.parse(txt) : null; } catch {}
  if (r.status === 401 && sesion && !reintento) { await refrescar(); return http(ruta, { method, body, headers }, true); }
  if (!r.ok) throw new Error(traducirError(j, r.status));
  return j;
}
const rpc = (fn, args = {}) => http(`/rest/v1/rpc/${fn}`, { method: "POST", body: args }).catch(e => {

// Las notas son una lista plana [{id, curso, periodo, v, peso}]. Todos los cálculos aceptan un periodo (trimestre/ciclo);
// por defecto usan el filtro elegido en pantalla (periodoSel) y null significa «todos los periodos».
class Estudiante {
  constructor(d) {
    this.id = d.id; this.codigo = d.codigo; this.nombre = d.nombre; this.docente_id = d.docente_id;
    this.perfil_id = d.perfil_id; this.institucion_id = d.institucion_id; this.carrera_id = d.carrera_id || null; this.ciclo = d.ciclo || 1; this.grado_id = d.grado_id || null;
    this.notas = (d.notas || []).map(n => ({ id: n.id, curso: n.curso_id, periodo: n.periodo_id, v: Number(n.nota), peso: n.peso || 1,
      titulo: n.titulo || "", comentario: (n.notas_detalle && n.notas_detalle.comentario) || "" })).sort((a, b) => a.id - b.id);
  }
  de(per) { return per ? this.notas.filter(n => n.periodo === per) : this.notas; }
  deCurso(c, per = periodoSel) { return this.de(per).filter(n => n.curso === c); }
  totalNotas(per = periodoSel) { return this.de(per).length; }
  promedioCurso(c, per = periodoSel) { return mediaPond(this.deCurso(c, per)); }
  promedio(per = periodoSel) { const cs = [...new Set(this.de(per).map(n => n.curso))]; return cs.length ? media(cs.map(c => this.promedioCurso(c, per))) : 0; }
  aprobado(per = periodoSel) { return this.totalNotas(per) > 0 && this.promedio(per) >= NOTA_APROBACION; }
  estado(per = periodoSel) { return !this.totalNotas(per) ? "Sin notas" : this.aprobado(per) ? "Aprobado" : "Reprobado"; }
}

function donut(a, b, ca, cb) {

  return `<svg viewBox="0 0 140 140" width="150" height="150" style="display:block;margin:auto">
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="${cb}" stroke-width="24"/>
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="${ca}" stroke-width="24" stroke-dasharray="${pa * C} ${C}" transform="rotate(-90 70 70)"/>
    <text x="70" y="75" text-anchor="middle" font-size="20" font-weight="700" style="fill:var(--ink)">${t ? Math.round(pa * 100) : 0}%</text></svg>`;
}
function bars(lista) {

  const w = Math.max(280, data.length * 46), h = 170;

    [0, NOTA_MAX / 2, NOTA_MAX].map(v => `<line x1="0" x2="${w}" y1="${h - v * h / NOTA_MAX}" y2="${h - v * h / NOTA_MAX}" style="stroke:var(--line)"/><text x="0" y="${h - v * h / NOTA_MAX - 2}" font-size="9" style="fill:var(--mute)">${v}</text>`).join("") +
    data.map((e, i) => { const p = e.promedio(), bh = p * h / NOTA_MAX, x = 20 + i * 44;
      return `<rect x="${x}" y="${h - bh}" width="26" height="${bh}" rx="3" fill="${e.aprobado() ? "#0e9aa7" : "#8b3df0"}"/>

/* ===== Cursos en tarjetas (con banner de patrón) ===== */
const PALETA = ["#a594f9", "#0d82d8", "#ff7aa8", "#5aa9f0", "#7566e0", "#f9c85f", "#34c3a0", "#f08a5d"];
const cacheBanner = new Map();
const bannerCurso = id => cacheBanner.get(id) || (cacheBanner.set(id, dibujarBanner(id)), cacheBanner.get(id));

  else if (tipo === 1) for (let y = -1; y < 4; y++) for (let x = -1; x < 9; x++) { const X = x * 50 + (y % 2 ? 25 : 0), Y = y * 40; f += `<rect x="${X}" y="${Y}" width="50" height="50" transform="rotate(45 ${X + 25} ${Y + 25})" fill="${tono()}" fill-opacity="${op()}"/>`; }

// Reduce la imagen elegida a un cuadrado de 192x192 (JPEG) para guardarla como foto de perfil
function reducirFoto(archivo) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(archivo);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const S = 192, c = document.createElement("canvas"); c.width = c.height = S;
      const g = c.getContext("2d"), m = Math.min(img.width, img.height);
      g.fillStyle = "#fff"; g.fillRect(0, 0, S, S); g.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
      let q = .85, d = c.toDataURL("image/jpeg", q); while (d.length > 40000 && q > .3) { q -= .1; d = c.toDataURL("image/jpeg", q); }
      res(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("No se pudo leer esa imagen. Elige una foto JPG o PNG.")); };
    img.src = url;
  });
}
async function subirFoto(archivo) {
  if (!archivo) return;
  const d = await reducirFoto(archivo);
  await rpc("actualizar_mi_foto", { p_foto: d }); fotos[yo.id] = d; yo.foto = d; render(); toast("Foto actualizada.");
}

// Transiciones (View Transitions API): fundido con blur entre pantallas y elemento compartido entre una tarjeta y su ventana.
// Si el navegador no las soporta (o el usuario apagó los efectos en Mi cuenta) todo funciona igual, sin animación.
const efectosActivos = () => document.documentElement.dataset.efectos !== "off";   // se controla en Mi cuenta (por defecto activados)
const hayTransiciones = () => !!document.startViewTransition && efectosActivos();

function unaVez(fn) { let hecho = false; return () => { if (hecho) return; hecho = true; fn(); }; }
function conTransicion(fn) {
  if (!hayTransiciones()) { fn(); return; }

  raiz.classList.add("vt-pagina");
  const f = unaVez(fn), t = document.startViewTransition(f);
  t.ready.catch(() => {}); t.finished.then(quitar, quitar); t.updateCallbackDone.catch(e => console.error(e));
  setTimeout(() => { f(); quitar(); }, 1200);   // red de seguridad
}let compartidoAct = null;   // {sel, nombre}: elemento de la pantalla al que la ventana abierta "vuelve" al cerrarse
function abrirDlg(html, opc = {}) {

// Abre la ventana "creciendo" desde el elemento `sel` (el destino dentro de `html` debe llevar view-transition-name: nombre)
function abrirCompartido(sel, nombre, html, opc = {}) {
  const origen = document.querySelector(sel);
  if (!hayTransiciones() || !origen) { abrirDlg(html, opc); return; }
  origen.style.viewTransitionName = nombre;
  const f = unaVez(() => { origen.style.viewTransitionName = ""; abrirDlg(html, { ...opc, compartido: { sel, nombre } }); });
  const t = document.startViewTransition(f);
  t.ready.catch(() => {}); t.finished.catch(() => {}); t.updateCallbackDone.catch(e => console.error(e));
  setTimeout(f, 1200);
}
function cerrarDlg() {
  const c = compartidoAct, cierre = () => { if (dlg.open) dlg.close(); detalleId = null; compartidoAct = null; $("#dlgBody").innerHTML = ""; };
  const destino = c && dlg.open && hayTransiciones() ? document.querySelector(c.sel) : null;
  if (!destino) { cierre(); return; }
  const f = unaVez(() => { cierre(); destino.style.viewTransitionName = c.nombre; });
  const t = document.startViewTransition(f);
  t.ready.catch(() => {}); t.updateCallbackDone.catch(e => console.error(e));

/* ===== CSV (una fila por nota: codigo,nombre,periodo,curso,nota,peso,titulo,comentario) ===== */
function filaCSV(linea, sep) {
  const r = []; let c = "", q = false;
  for (let i = 0; i < linea.length; i++) {
    const ch = linea[i];
    if (q) { if (ch === '"') { if (linea[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { r.push(c); c = ""; }
    else c += ch;
  }
  r.push(c); return r;
}
function desdeCSV(texto) {
  const lineas = texto.replace(/^﻿/, "").split(/\r?\n/).filter(l => l.trim());
  const lista = []; let omitidas = 0;
  if (!lineas.length) return { lista, omitidas };
  const sep = lineas[0].includes(",") ? "," : ";";
  const porCodigo = new Map();   // codigo -> { codigo, nombre, notas, ok }
  const cs = miCursos(), ps = misPeriodos();
  for (const l of lineas.slice(/^codigo/i.test(lineas[0].trim()) ? 1 : 0)) {
    const f = filaCSV(l, sep).map(x => x.trim()), codigo = f[0] || "", nombre = f[1] || "", k = codigo.toUpperCase();
    if (!codigoValido(codigo) || !nombreValido(nombre)) { omitidas++; continue; }
    if (!porCodigo.has(k)) porCodigo.set(k, { codigo, nombre, notas: [], ok: true });
    const r = porCodigo.get(k);
    if (!f[2] && !f[3] && !f[4]) continue;   // estudiante sin notas
    const per = ps.find(p => p.nombre.toLowerCase() === f[2].toLowerCase()), cu = cs.find(c => c.nombre.toLowerCase() === f[3].toLowerCase());
    const nota = convertirDouble((f[4] || "").replace(",", ".")), peso = f[5] ? Number(f[5]) : 1;
    if (!per || !cu || !notaValida(nota) || !Number.isInteger(peso) || peso < 1 || peso > 10) { r.ok = false; continue; }
    if ((f[6] || "").length > 60 || (f[7] || "").length > 500) { r.ok = false; continue; }
    r.notas.push({ curso: cu.id, periodo: per.id, nota, peso, titulo: f[6] || "", comentario: f[7] || "" });
  }
  for (const r of porCodigo.values()) {
    const maxPor = Math.max(0, ...Object.values(r.notas.reduce((m, n) => { const k = n.curso + "-" + n.periodo; m[k] = (m[k] || 0) + 1; return m; }, {})));
    if (r.ok && maxPor <= MAX_NOTAS) lista.push(r); else omitidas++;
  }
  return { lista, omitidas };
}
