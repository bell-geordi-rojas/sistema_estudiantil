<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Estudiantil</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Segoe UI",system-ui,sans-serif;background:#0f1420;color:#e5e9f2}
.c{text-align:center;width:min(420px,86vw)}
img{width:84px;height:84px;border-radius:14px;margin-bottom:14px}
p{color:#8f9ab0;margin:6px 0 16px}
.b{height:8px;border-radius:6px;background:#262e42;overflow:hidden}
.b i{display:block;height:100%;width:0;background:#0e9aa7;transition:width .25s}
.b.ind i{width:40%;animation:m 1.1s ease-in-out infinite alternate}
@keyframes m{from{margin-left:0}to{margin-left:60%}}
</style></head>
<body><div class="c"><img src="icon.png" alt=""><h2 style="margin:0">Estudiantil</h2><p id="t">Buscando actualizaciones…</p>
<div class="b ind" id="b"><i id="i"></i></div></div>
<script>
window.estado = (texto, pct) => {
  document.getElementById("t").textContent = texto;
  const b = document.getElementById("b"), i = document.getElementById("i");
  if (pct >= 0) { b.classList.remove("ind"); i.style.width = pct + "%"; i.style.marginLeft = 0; } else b.classList.add("ind");
};
</script></body></html>
