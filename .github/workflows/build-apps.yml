name: Compilar programas

# Genera el instalador de Windows y el .apk de Android y los publica en la versión «app-latest».
# Se ejecuta a mano (Actions > Compilar programas > Run workflow) o al cambiar la carpeta app/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-apps.yml"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compilar instalador de Windows
        working-directory: app/electron
        shell: bash
        run: |
          npm install
          npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/electron/dist/Estudiantil-Setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar APK
        working-directory: app/android
        run: |
          npm install
          npx cap add android
          npx capacitor-assets generate --android --assetPath ../assets --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Estudiantil.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: app/android/Estudiantil.apk

  publicar:
    needs: [windows, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: salida
          merge-multiple: true
      - name: Publicar en la versión app-latest
        run: |
          ls -l salida
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --title "Programas (última versión)" --notes "Instalador para Windows (Estudiantil-Setup.exe) y APK para Android (Estudiantil.apk). Se actualizan solos al cambiar la carpeta app/."
          gh release upload app-latest salida/Estudiantil-Setup.exe salida/Estudiantil.apk --clobber
